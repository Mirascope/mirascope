version: 2
updates:
  - package-ecosystem: uv
    directory: /python
    schedule:
      interval: weekly
    groups:
      python-security:
        applies-to: security-updates
        patterns: ["*"]
      python-routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /website/api2mdx
    schedule:
      interval: weekly
    groups:
      api2mdx-security:
        applies-to: security-updates
        patterns: ["*"]
      api2mdx-routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      root-security:
        applies-to: security-updates
        patterns: ["*"]
      root-routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: /typescript
    schedule:
      interval: weekly
    groups:
      typescript-security:
        applies-to: security-updates
        patterns: ["*"]
      typescript-routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: bun
    directory: /website
    schedule:
      interval: weekly
    groups:
      website-security:
        applies-to: security-updates
        patterns: ["*"]
      website-routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      actions-routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
